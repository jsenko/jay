# Checks the marketplace and its plugins on every push to main. Pull requests are
# added as a trigger once the repository is public.
name: check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # For `claude plugin validate`, which needs no login. Pinned so a new
      # release cannot change the result of an unchanged commit.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.295

      - name: Install plugin dependencies
        run: |
          for pkg in plugins/*/package.json; do
            [ -f "$pkg" ] || continue
            (cd "$(dirname "$pkg")" && npm ci --ignore-scripts)
          done

      - name: Structure
        run: tools/check/check.sh

      - name: Shell scripts
        run: shellcheck -S warning install.sh tools/check/check.sh $(find tools/plugin plugins -name '*.sh' -not -path '*/node_modules/*' 2>/dev/null)

      - name: Plugin tests
        run: |
          for pkg in plugins/*/package.json; do
            [ -f "$pkg" ] || continue
            if node -e "process.exit(require('./$pkg').scripts?.test ? 0 : 1)"; then
              (cd "$(dirname "$pkg")" && npm test)
            fi
          done
