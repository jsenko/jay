<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jay</title>
  <link rel="stylesheet" href="/shell/shell.css">
</head>
<body>
  <div id="app">
    <aside id="nav">
      <div class="brand">
        <button id="collapse" title="Collapse menu" aria-label="Collapse menu">☰</button>
        <span class="label" id="brand"></span>
      </div>
      <nav id="views"></nav>
      <div class="foot label" id="foot"></div>
    </aside>

    <main id="list">
      <div class="listhead">
        <h1 id="heading"></h1>
        <select id="filter" hidden></select>
        <span class="spacer"></span>
        <span class="updated" id="updated"></span>
        <button id="refresh" title="Refresh now">↻</button>
      </div>
      <div id="items"></div>
    </main>

    <aside id="detail" hidden>
      <div class="detailhead">
        <span class="kind" id="detail-kind"></span>
        <span class="spacer"></span>
        <button id="close" title="Close (Esc)" aria-label="Close details">✕</button>
      </div>
      <div id="detail-body"></div>
    </aside>
  </div>

  <script type="module" src="/shell/shell.js"></script>
</body>
</html>
